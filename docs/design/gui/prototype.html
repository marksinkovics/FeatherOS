<title>FeatherOS Desktop Prototype</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a full-bleed simulated screen under a thin studio strip that is not part of the OS. */
:root{color-scheme:dark;--s-bg:#0c1016;--s-fg:#d8dee8;--s-mut:#8e99a9;--s-line:#2a3341;--s-on:#2a3341;
--sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
--bar-h:28px;--r-s:4px;--r-m:6px;--r-l:10px;--fast:80ms;--base:120ms;--slow:180ms;--ease:cubic-bezier(.2,.7,.2,1)}
[data-fos=dusk]{color-scheme:dark;--desk:#141c2b;--bar:#1a2334;--surface:#212c3f;--raised:#2a374c;--sunken:#182132;--line:#3a4860;--text:#e8edf5;--muted:#a7b3c6;--accent:#f0a840;--on-accent:#2a1a04;--accent-soft:#4a3b28;--ok:#62c48f;--warn:#f0c04a;--bad:#f0776c;--info:#6cb6f0;--w1:#1a2740;--w2:#22324d;--w3:#2d3f5a;--w4:#49506000;--wf:#f0a84026;--sh:rgba(4,8,16,.55);--focus:#ffd28a}
[data-fos=airy]{color-scheme:light;--desk:#cfe3f2;--bar:#f7f9fb;--surface:#fbfcfd;--raised:#ffffff;--sunken:#edf2f6;--line:#d3dde6;--text:#18242e;--muted:#526170;--accent:#1570bd;--on-accent:#ffffff;--accent-soft:#d6e9f8;--ok:#1a7f4d;--warn:#946000;--bad:#c33a31;--info:#1570bd;--w1:#dcecf7;--w2:#c2dcf0;--w3:#a6cbe7;--w4:#8cb9dd00;--wf:#ffffff66;--sh:rgba(30,60,90,.28);--focus:#0b4f8a}
[data-fos=paper]{color-scheme:light;--desk:#d9cdb4;--bar:#f3ecdc;--surface:#f8f2e6;--raised:#fffbf2;--sunken:#eadfcb;--line:#cbbda3;--text:#2a2419;--muted:#5f5441;--accent:#4e6b3a;--on-accent:#fffbf2;--accent-soft:#dde3c8;--ok:#3a7341;--warn:#855c0c;--bad:#a23a2c;--info:#2f6480;--w1:#e4d9c3;--w2:#d3c5a8;--w3:#bfae8d;--w4:#a8966f00;--wf:#4e6b3a22;--sh:rgba(60,45,20,.28);--focus:#2c4220}
*{box-sizing:border-box;font-synthesis:none}
html,body{height:100%;margin:0;background:var(--s-bg);overflow:hidden}
body,button,input,select{font:400 13px/16px var(--sans)}
button{color:inherit;background:none;border:0;padding:0;cursor:default}
svg{display:block;flex:none}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus,#ffd28a);outline-offset:1px}
#app{display:flex;flex-direction:column;height:100%;color:var(--text)}
#studio{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--s-bg);color:var(--s-fg);border-bottom:1px solid var(--s-line);flex:none}
#studio .nm{color:var(--s-mut);margin-right:auto}
.sg{display:flex;align-items:center;gap:6px;color:var(--s-mut)}
.sseg{display:inline-flex;border:1px solid var(--s-line);border-radius:var(--r-s);overflow:hidden}
.sseg button{padding:3px 8px;color:var(--s-fg)}
.sseg button+button{border-left:1px solid var(--s-line)}
.sseg button[aria-pressed=true]{background:var(--s-on);color:#fff}
.sbtn{padding:3px 8px;border:1px solid var(--s-line);border-radius:var(--r-s);color:var(--s-fg)}
.sbtn:hover,.sseg button:hover{background:#1c2430}
#holder{flex:1;min-height:0;display:flex;overflow:auto;position:relative;background:#07090d}
#screen{position:relative;flex:1;min-width:0;height:100%;overflow:hidden;background:var(--desk);user-select:none;-webkit-user-select:none}
[data-frame=xga] #screen{flex:none;width:1024px;height:768px;margin:auto}
#wall{position:absolute;inset:0;width:100%;height:100%}
#wall .a{fill:var(--w1)}#wall .b{fill:var(--w2)}#wall .c{fill:var(--w3)}#wall .f{fill:var(--wf)}
#wall .r,.cd .wall .r{fill:none;stroke:var(--desk);stroke-width:7;stroke-linecap:round}

#bar{position:absolute;inset:0 0 auto;height:var(--bar-h);display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--bar);border-bottom:1px solid var(--line);z-index:9000}
[data-tier=gpu] #bar{background:color-mix(in srgb,var(--bar) 70%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.bi{height:24px;padding:0 8px;border-radius:var(--r-s);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;color:var(--text)}
.bi:hover,.bi.open{background:var(--raised)}
.bi.open{background:var(--accent);color:var(--on-accent)}
#feather-btn{padding:0 6px;color:var(--accent)}
#feather-btn.open{color:var(--on-accent)}
#appname{color:var(--accent)}
#appname.open{color:var(--on-accent)}
#menus{display:flex;gap:2px;min-width:0;overflow:hidden}
#menus .bi{color:var(--muted)}
#menus .bi:hover{color:var(--text)}
#menus .bi.open{color:var(--on-accent)}
#status{margin-left:auto;display:flex;align-items:center;gap:1px;flex:none}
.wsd{display:inline-flex;gap:3px;align-items:center}
.wsd i{width:14px;height:10px;border:1px solid var(--muted);border-radius:2px;display:block}
.wsd i.on{background:var(--accent);border-color:var(--accent)}
.wsd i.has:not(.on){background:var(--muted)}
.editing #status .bi,.editing #dock .di{outline:1px dashed var(--accent);outline-offset:-1px;cursor:grab;position:relative}
.rm{display:none;position:absolute;right:-3px;top:-3px;width:14px;height:14px;border-radius:7px;background:var(--bad);color:#fff;font-size:11px;line-height:13px;text-align:center}
.editing .rm{display:block}
#editbar{position:absolute;left:50%;top:38px;transform:translateX(-50%);z-index:9400;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 6px 18px var(--sh);padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:max-content;max-width:calc(100% - 24px)}

#dock{position:absolute;z-index:8800;display:flex;gap:4px;padding:5px;background:var(--bar);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:0 6px 16px var(--sh);transition:transform var(--slow) var(--ease);max-width:calc(100% - 12px);max-height:calc(100% - 40px)}
[data-tier=gpu] #dock{background:color-mix(in srgb,var(--bar) 62%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
#dock[data-pos=bottom]{left:50%;bottom:6px;transform:translateX(-50%);overflow-x:auto}
#dock[data-pos=left]{left:6px;top:50%;margin-top:14px;transform:translateY(-50%);flex-direction:column;overflow-y:auto}
#dock[data-pos=right]{right:6px;top:50%;margin-top:14px;transform:translateY(-50%);flex-direction:column;overflow-y:auto}
#dock.hid[data-pos=bottom]{transform:translate(-50%,calc(100% + 8px))}
#dock.hid[data-pos=left]{transform:translate(calc(-100% - 8px),-50%)}
#dock.hid[data-pos=right]{transform:translate(calc(100% + 8px),-50%)}
#dockzone{position:absolute;z-index:8700}
.di{position:relative;width:var(--dock,44px);height:var(--dock,44px);flex:none;border-radius:var(--r-m);transition:transform var(--fast) var(--ease)}
.di:hover{transform:translateY(-2px)}
#dock[data-pos=left] .di:hover{transform:translateX(2px)}
#dock[data-pos=right] .di:hover{transform:translateX(-2px)}
[data-tier=gpu] #dock[data-pos=bottom] .di:hover{transform:translateY(-6px) scale(1.18)}
.tile{width:100%;height:100%;border-radius:var(--r-m);display:grid;place-items:center;color:#fff;background:var(--c,#555)}
.dot{position:absolute;left:50%;bottom:-3px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--muted);display:none}
.di.run .dot{display:block}.di.foc .dot{background:var(--accent);width:12px;margin-left:-6px}.di.mini .dot{background:none;border:1px solid var(--muted)}
#dock[data-pos=left] .dot{left:-3px;bottom:auto;top:50%;margin:-2px 0 0}#dock[data-pos=right] .dot{left:auto;right:-3px;bottom:auto;top:50%;margin:-2px 0 0}
#dock[data-pos=left] .di.foc .dot,#dock[data-pos=right] .di.foc .dot{width:4px;height:12px;margin-top:-6px}
.dsep{flex:none;background:var(--line);width:1px;margin:4px 2px}
#dock[data-pos=left] .dsep,#dock[data-pos=right] .dsep{width:auto;height:1px;margin:2px 4px}
#tip{position:absolute;z-index:9800;padding:3px 7px;border-radius:var(--r-s);background:var(--text);color:var(--surface);pointer-events:none;white-space:nowrap}

.dicon{position:absolute;right:14px;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:var(--r-m);color:var(--text);text-align:center}
.dicon:hover{background:color-mix(in srgb,var(--raised) 55%,transparent)}
.dicon span{padding:0 4px;border-radius:3px;background:color-mix(in srgb,var(--desk) 65%,transparent)}
.dicon .ic{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-m);background:var(--raised);color:var(--accent);border:1px solid var(--line)}

#windows{position:absolute;inset:0}
.win{position:absolute;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 2px 6px var(--sh);min-width:0}
.win.foc{box-shadow:0 10px 26px var(--sh),0 2px 6px var(--sh);border-color:color-mix(in srgb,var(--text) 26%,var(--line))}
.win.snapped{border-radius:0}
.tb{height:32px;flex:none;display:flex;align-items:center;gap:6px;padding:0 4px 0 6px;background:var(--sunken);border-bottom:1px solid var(--line);border-radius:5px 5px 0 0;color:var(--muted)}
.win.snapped .tb{border-radius:0}
.win.foc .tb{background:var(--raised);color:var(--text)}
.tb .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app[data-wbtn=left] .tb .ttl{text-align:center;padding-right:64px}
.wbtn{width:26px;height:24px;display:grid;place-items:center;border-radius:var(--r-s);color:inherit}
.wbtn:hover{background:var(--line)}
.wbtn.x:hover{background:var(--bad);color:#fff}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;border-radius:0 0 5px 5px;user-select:text;-webkit-user-select:text}
.hd{position:absolute;z-index:2}
.hd[data-d=n]{left:6px;right:6px;top:-3px;height:6px;cursor:ns-resize}.hd[data-d=s]{left:6px;right:6px;bottom:-3px;height:6px;cursor:ns-resize}
.hd[data-d=e]{top:6px;bottom:6px;right:-3px;width:6px;cursor:ew-resize}.hd[data-d=w]{top:6px;bottom:6px;left:-3px;width:6px;cursor:ew-resize}
.hd[data-d=se]{right:-3px;bottom:-3px;width:10px;height:10px;cursor:nwse-resize}.hd[data-d=sw]{left:-3px;bottom:-3px;width:10px;height:10px;cursor:nesw-resize}
.hd[data-d=ne]{right:-3px;top:-3px;width:10px;height:10px;cursor:nesw-resize}.hd[data-d=nw]{left:-3px;top:-3px;width:10px;height:10px;cursor:nwse-resize}
#snap{position:absolute;z-index:8600;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:var(--r-m);pointer-events:none;transition:left var(--fast),top var(--fast),width var(--fast),height var(--fast)}
.ghost{position:absolute;z-index:8900;border:2px solid var(--accent);border-radius:var(--r-m);pointer-events:none}

.pop{position:absolute;z-index:9500;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 8px 22px var(--sh);color:var(--text);max-height:calc(100% - 34px);overflow:auto}
[data-tier=gpu] .pop{background:color-mix(in srgb,var(--raised) 82%,transparent);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.menu{padding:4px;min-width:190px}
.mi{display:flex;flex:none;align-items:center;gap:8px;width:100%;height:24px;padding:0 8px;border-radius:var(--r-s);text-align:left;white-space:nowrap}
.mi:hover,.mi:focus-visible,.mi.sel{background:var(--accent);color:var(--on-accent);outline:none}
.mi[disabled]{color:var(--muted);opacity:.6;background:none}
.mi .k{margin-left:auto;padding-left:18px;color:var(--muted);font-family:var(--mono)}
.mi:hover .k,.mi:focus-visible .k{color:inherit}
.ms{height:1px;background:var(--line);margin:4px 6px}
.mh{padding:5px 8px 3px;color:var(--muted)}
.ck{width:12px;flex:none}

#fmenu{width:600px;max-width:calc(100% - 12px);display:grid;grid-template-columns:190px minmax(0,1fr);height:430px}
#fmenu .side{background:var(--sunken);border-right:1px solid var(--line);padding:8px 5px;display:flex;flex-direction:column;border-radius:5px 0 0 5px;overflow:auto}
.who{display:flex;gap:8px;align-items:center;padding:4px 7px 9px}
.who .av{width:32px;height:32px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.who small{display:block;font-size:13px;color:var(--muted)}
#fmenu .main{padding:8px;display:flex;flex-direction:column;gap:7px;min-width:0;min-height:0}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;border-radius:11px;color:var(--muted)}
.chip:hover{background:var(--line);color:var(--text)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
#fresults{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:1px}
.fr{display:flex;align-items:center;gap:9px;padding:4px 6px;border-radius:var(--r-s);width:100%;text-align:left}
.fr .t{width:28px;height:28px;flex:none}
.fr small{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr>span{min-width:0}
.fr:hover,.fr.sel{background:var(--accent);color:var(--on-accent)}
.fr:hover small,.fr.sel small{color:inherit}
.empty{padding:26px 10px;color:var(--muted);text-align:center}

.btn{height:26px;padding:0 12px;border:1px solid var(--line);background:var(--raised);border-radius:var(--r-s);color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}.btn:active{background:var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.pri:hover{filter:brightness(1.07)}
.btn.dan{color:var(--bad);border-color:var(--bad);background:none}.btn.dan:hover{background:var(--bad);color:#fff}
.btn.gh{border-color:transparent;background:none}.btn.gh:hover{background:var(--line)}
.btn[disabled]{opacity:.45;border-color:var(--line);filter:none;background:var(--sunken);color:var(--muted)}
.inp{height:26px;padding:0 8px;border:1px solid var(--line);background:var(--sunken);color:var(--text);border-radius:var(--r-s);width:100%;min-width:0;user-select:text;-webkit-user-select:text}
.inp:focus{border-color:var(--accent);outline:1px solid var(--accent);outline-offset:-1px}
.inp.err{border-color:var(--bad)}
.inp::placeholder{color:var(--muted)}
input[type=checkbox].c,input[type=radio].c{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;border:1px solid var(--muted);background:var(--sunken);border-radius:3px;display:inline-grid;place-items:center;flex:none}
input[type=radio].c{border-radius:8px}
.c:checked{background:var(--accent)!important;border-color:var(--accent)!important}
input[type=checkbox].c:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg)}
input[type=radio].c:checked::after{content:"";width:6px;height:6px;border-radius:3px;background:var(--on-accent)}
input.sw{appearance:none;-webkit-appearance:none;width:32px;height:18px;margin:0;border-radius:9px;background:var(--line);position:relative;flex:none;transition:background var(--base)}
input.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:7px;background:var(--text);transition:transform var(--base) var(--ease)}
input.sw:checked{background:var(--accent)}input.sw:checked::after{transform:translateX(14px);background:var(--on-accent)}
input.rg{appearance:none;-webkit-appearance:none;width:100%;height:16px;margin:0;background:none;--v:50%}
input.rg::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--v),var(--line) var(--v))}
input.rg::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input.rg::-moz-range-progress{height:4px;background:var(--accent)}
input.rg::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:7px;background:var(--text);border:2px solid var(--accent)}
input.rg::-moz-range-thumb{width:10px;height:10px;border-radius:7px;background:var(--text);border:2px solid var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--sunken)}
.seg button{padding:4px 10px}.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 8px;flex:none;overflow-x:auto}
.tabs button{padding:7px 10px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--text)}.tabs button[aria-selected=true]{color:var(--text);border-color:var(--accent)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog.ind i{width:32%;animation:slide 1.3s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(320%)}}
.badge{display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:9px;border:1px solid currentColor;line-height:16px}
.h20{font-size:17px;line-height:20px}.h24{font-size:20px;line-height:24px}.h32{font-size:27px;line-height:32px}.mut{color:var(--muted)}.mono{font-family:var(--mono)}
.tn{font-variant-numeric:tabular-nums}

.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>div:first-child{flex:1;min-width:0}
.row small{display:block;font-size:13px;color:var(--muted)}
.ctrl{flex:none;display:flex;align-items:center;gap:8px;max-width:58%}
.st-grid{padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.st-grp h3{margin:0 0 5px;font:400 13px/16px var(--sans);color:var(--muted)}
.st-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:2px}
.st-it{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 3px;border-radius:var(--r-m);text-align:center}
.st-it:hover{background:var(--raised)}
.st-it .t{width:36px;height:36px}
.st-head{display:flex;align-items:center;gap:7px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none}
.st-pane{padding:10px 16px 16px;max-width:560px;width:100%;margin:0 auto}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:6px 0}
.thm{border:2px solid var(--line);border-radius:var(--r-m);padding:3px;text-align:left}
.thm[aria-pressed=true]{border-color:var(--accent)}
.thm .sw2{height:44px;border-radius:3px;background:var(--desk);display:flex;align-items:flex-end;padding:4px;gap:3px;margin-bottom:3px}
.thm .sw2 i{width:14px;height:20px;background:var(--surface);border:1px solid var(--line);border-radius:2px}.thm .sw2 i:last-child{background:var(--accent);border-color:var(--accent)}

table.tm{border-collapse:collapse;width:100%;min-width:430px}
.tm th{position:sticky;top:0;background:var(--raised);font-weight:400;color:var(--muted);text-align:right;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.tm th:first-child,.tm td:first-child{text-align:left}
.tm td{padding:3px 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tm tr.sel td{background:var(--accent);color:var(--on-accent)}
.tm tbody tr:hover:not(.sel) td{background:var(--raised)}
.simtag{padding:4px 10px;background:var(--accent-soft);color:var(--text);flex:none}
.perf{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;padding:10px}
.pc{border:1px solid var(--line);border-radius:var(--r-m);padding:7px 9px;background:var(--sunken);min-width:0}

    const row = $$('.qr', list)[i];
    if (row) { input.setAttribute('aria-activedescendant', row.id); row.scrollIntoView({ block:'nearest' }); } else input.removeAttribute('aria-activedescendant');
    $('#qverb', n).textContent = it?.verb || 'Open';
    $('#qaltk', n).innerHTML = it?.alt ? `<kbd>⇧↵</kbd> ${esc(it.alt.t)}` : '';
    if (!it) { prevEl.innerHTML = '<div class="mut">Type to search apps, settings, files and commands.</div>'; return; }
    prevEl.innerHTML = `${it.app ? tile(it.app, 26) : `<span class="tile t" style="--c:var(--accent-soft);color:var(--text)">${ic(it.icon, 24)}</span>`}<strong>${esc(it.name)}</strong><div class="mut">${esc(it.desc || '')}</div>${(it.meta || []).map(m => `<div class="qmeta">${esc(m)}</div>`).join('')}<div class="qact"><button class="btn pri" id="qgo">${esc(it.verb)}</button>${it.alt ? `<button class="btn" id="qalt">${esc(it.alt.t)}</button>` : ''}</div>`;
    $('#qgo', prevEl).onclick = () => exec(it);
    if (it.alt) $('#qalt', prevEl).onclick = () => exec(it, true);
  };
  const draw = () => {
    const groups = quillResults(input.value);
    flat = groups.flatMap(g => g.items); modes.hidden = !!input.value;
    let c = 0;
    list.innerHTML = groups.map(g => `<div role="group" aria-label="${esc(g.h)}"><div class="qh">${esc(g.h)}</div>${g.items.map(it => { const i = c++; return `<div class="qr" role="option" id="qr${i}" data-i="${i}" aria-selected="false">${it.app ? tile(it.app, 15) : `<span class="tile t" style="--c:var(--accent-soft);color:var(--text)">${ic(it.icon, 15)}</span>`}<span class="n">${esc(it.name)}</span><small>${esc(it.desc || '')}</small></div>`; }).join('')}</div>`).join('') || `<div class="qempty">${input.value.trim().length > 1 ? 'No result' : 'Keep typing'}</div>`;
    select(0);
  };
  input.oninput = draw;
  input.onkeydown = e => {
    if (e.ctrlKey && e.altKey) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (flat.length) select((sel + (e.key === 'ArrowDown' ? 1 : -1) + flat.length) % flat.length); }

  list.onclick = e => { const r = e.target.closest('.qr'); if (r) exec(flat[+r.dataset.i]); };

  n.onpointerdown = e => { if (e.target === n) { e.preventDefault(); closeQuill(); } };
  input.value = init; draw(); input.focus();
  anim($('.qbox', n), S.tier === 'gpu' ? [{ opacity:0, transform:'scale(.97)' }, { opacity:1, transform:'none' }] : [{ opacity:0, transform:'translateY(-6px)' }, { opacity:1, transform:'none' }], { duration:120 });
}
function openFeather() {
  const m = el(`<div class="pop" id="fmenu" role="dialog" aria-label="Feather menu"><div class="side"><div class="who"><span class="av">${ic('user',17)}</span><span>feather<small>Administrator</small></span></div></div><div class="main"><input class="inp" id="fq" placeholder="Search apps and settings" aria-label="Search apps and settings" autocomplete="off"><div class="chips" id="fchips"></div><div id="fresults"></div></div></div>`);
  const side = $('.side', m);
  [[ 'About FeatherOS','info',about ],[ 'Quill Command Center','search',()=>openQuill() ],[ 'System Settings…','sliders',()=>openApp('settings') ],[ 'Task Manager','pulse',()=>openApp('tasks') ],[ 'Customize Panels…','dock',()=>setEditing(true) ],'-',[ 'Lock Screen','lock',lockScreen ],[ 'Log Out…','logout',()=>confirmPower('Log out?','Open programs will close.','Log Out',logout) ],'-',[ 'Sleep','moon',sleep ],[ 'Restart…','restart',()=>confirmPower('Restart FeatherOS?','Disks are synced, then the computer restarts.','Restart',restart) ],[ 'Shut Down…','power',()=>confirmPower('Shut down?','Disks are synced, then the computer turns off.','Shut Down',shutdown) ]].forEach(x => {
    if (x === '-') return side.append(el('<div class="ms"></div>'));
    const b = el(`<button class="mi">${ic(x[1],15)}<span>${x[0]}</span></button>`); b.onclick = () => { closePop(); x[2](); }; side.append(b);
  });
  const btn = $('#feather-btn'); showPop(m, btn);
  const q = $('#fq', m), chips = $('#fchips', m), res = $('#fresults', m);
  const cats = ['Favorites','Recent','All','Accessories','Games','System','Settings'];
  chips.innerHTML = cats.map(c => `<button class="chip" data-c="${c}">${c}</button>`).join('');
  let list = [], idx = 0;
  const compute = () => {
    const v = q.value.trim().toLowerCase(), appE = Object.entries(APPS).map(([id, a]) => ({ k:'app', id, name:a.name, desc:a.desc, a }));
    const setE = SETF.map(s => ({ k:'set', id:s.id, name:s.name, desc:'Settings · ' + s.grp, icon:s.icon }));
    if (v) return [...appE, ...setE].filter(x => (x.name + ' ' + x.desc).toLowerCase().includes(v)).sort((x, y) => x.name.toLowerCase().indexOf(v) - y.name.toLowerCase().indexOf(v));
    if (S.cat === 'Favorites') return S.favs.map(id => appE.find(x => x.id === id));
    if (S.cat === 'Recent') return S.recent.map(id => appE.find(x => x.id === id));
    if (S.cat === 'All') return appE.sort((x, y) => x.name.localeCompare(y.name));
    if (S.cat === 'Settings') return setE;
    return appE.filter(x => x.a.cat === S.cat);
  };
  const go = x => { closePop(); if (x.k === 'app') openApp(x.id); else openSettings(x.id); };
  const draw = () => {
    $$('.chip', chips).forEach(c => c.setAttribute('aria-pressed', c.dataset.c === S.cat && !q.value.trim()));
    list = compute(); idx = Math.min(idx, Math.max(0, list.length - 1)); res.innerHTML = '';
    if (!list.length) res.innerHTML = `<div class="empty">Nothing matches “${esc(q.value)}”.</div>`;
    list.forEach((x, i) => { const b = el(`<button class="fr ${i === idx && q.value.trim() ? 'sel' : ''}">${x.k === 'app' ? tile(x.a, 16) : `<span class="tile t" style="--c:var(--line);color:var(--text)">${ic(x.icon,16)}</span>`}<span>${esc(x.name)}<small>${esc(x.desc)}</small></span></button>`); b.onclick = () => go(x); res.append(b); });
  };
  $$('.chip', chips).forEach(c => c.onclick = () => { S.cat = c.dataset.c; q.value = ''; idx = 0; draw(); q.focus(); });
  q.oninput = () => { idx = 0; draw(); };
  q.onkeydown = e => { if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, list.length - 1); draw(); $('.sel', res)?.scrollIntoView({block:'nearest'}); } if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); draw(); $('.sel', res)?.scrollIntoView({block:'nearest'}); } if (e.key === 'Enter' && list[idx]) go(list[idx]); };
  draw(); if (!compact()) q.focus();
}

const THEMES = [['dusk','Calm Dusk','Blue slate and amber. No white flash after boot, comfortable at night. Recommended default.'],['airy','Light & Airy','Off-white and sky blue. The natural light mode to pair with Dusk.'],['paper','Warm Paper','Cream, ink and moss. The most distinctive, best as an optional theme.']];
