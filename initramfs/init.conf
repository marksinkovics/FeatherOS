# The built-in services init starts at boot, one per line: <policy> <command line>
#   once     runs to completion before the next line starts
#   respawn  runs in the background and is restarted when it exits
#   console  holds the terminal named before its command and is restarted when
#            it exits (one per terminal)
# A service that exits 5 times within 10 seconds is disabled.
# "env NAME=value" adds a variable to every service's environment.
# The administrator adds services as files in /etc/init.d/ (same format, merged in name order; a
# service replaces the built-in one that runs the same program, a console the one on its terminal)
# and removes built-in ones by listing a program name or terminal per line in /etc/init.disabled.
env PATH=/bin:/sbin:/system
once echo init: FeatherOS is starting its services
respawn dhcp
console /dev/tty1 shell
console /dev/tty2 shell
console /dev/tty3 shell
console /dev/tty4 shell
