# Services init starts at boot, one per line: <policy> <command line>
#   once     runs to completion before the next line starts
#   respawn  runs in the background and is restarted when it exits
#   console  holds the console and is restarted when it exits (at most one)
# A service that exits 5 times within 10 seconds is disabled.
# "env NAME=value" adds a variable to every service's environment.
env HOME=/home
env PATH=/system
once echo init: FeatherOS is starting its services
console shell
